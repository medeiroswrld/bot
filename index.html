<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Anti-FOIC: aplica tema salvo antes do React montar -->
  <script>
    (function() {
      var t = localStorage.getItem('amply-theme');
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- PWA: sem manifest + service worker o site nao e instalavel, e no iPhone
       notificacao web so funciona com o app na tela de inicio. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- iOS ignora os icones do manifest pra tela de inicio: usa este. -->
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Amply" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
